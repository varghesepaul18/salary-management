<aside class="sidebar" [class.mobile-nav-open]="mobileNavOpen()" (keydown.escape)="closeMobileNav()">
  <div class="sidebar-header">
    <a class="brand" routerLink="/app/employees" aria-label="ACME People and Pay" (click)="closeMobileNav()">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>ACME <span class="brand-light">People &amp; Pay</span></span>
    </a>
    <button mat-button type="button" class="sidebar-toggle" (click)="toggleSidebar()"
            [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
            [matTooltip]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'" matTooltipPosition="right">
      {{ collapsed() ? '›' : '‹' }}
    </button>
    <button mat-button type="button" class="mobile-menu-toggle" (click)="toggleMobileNav()"
            [attr.aria-label]="mobileNavOpen() ? 'Close navigation' : 'Open navigation'"
            [attr.aria-expanded]="mobileNavOpen()" aria-controls="primary-navigation">
      {{ mobileNavOpen() ? '×' : '☰' }}
    </button>
  </div>

  <p class="nav-label">WORKSPACE</p>
  <nav id="primary-navigation" aria-label="Main navigation">
    <a routerLink="/app/analytics" routerLinkActive="active" ariaCurrentWhenActive="page" title="Salary insights" (click)="closeMobileNav()">
      <span class="nav-glyph" aria-hidden="true">↗</span><span class="nav-text">Salary insights</span>
    </a>
    <a routerLink="/app/employees" routerLinkActive="active" ariaCurrentWhenActive="page" title="Employees" (click)="closeMobileNav()">
      <span class="nav-glyph people-glyph" aria-hidden="true">◎</span><span class="nav-text">Employees</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <div class="user-label"><strong>HR Manager</strong></div>
    <button mat-button type="button" class="sign-out" (click)="signOut()" aria-label="Log out" matTooltip="Log out" matTooltipPosition="below">↪</button>
  </div>
</aside>
