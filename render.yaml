databases:
  - name: salary-management-db
    databaseName: salary_management
    user: salary_app
    postgresMajorVersion: "18"
    plan: free

services:
  - type: web
    name: salary-management-api
    runtime: docker
    plan: free
    dockerfilePath: backend/salary-management-api/Dockerfile
    dockerContext: backend/salary-management-api
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: "10000"
      - key: SALARY_DB_HOST
        fromDatabase:
          name: salary-management-db
          property: host
      - key: SALARY_DB_PORT
        fromDatabase:
          name: salary-management-db
          property: port
      - key: SALARY_DB_NAME
        fromDatabase:
          name: salary-management-db
          property: database
      - key: SALARY_DB_USERNAME
        fromDatabase:
          name: salary-management-db
          property: user
      - key: SALARY_DB_PASSWORD
        fromDatabase:
          name: salary-management-db
          property: password
      - key: HR_MANAGER_USERNAME
        value: hr-manager
      - key: HR_MANAGER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          name: salary-management-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: salary-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/render-build.mjs
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: API_BASE_URL
        fromService:
          name: salary-management-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
