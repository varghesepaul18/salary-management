spring:
  application:
    name: salary-management-api
  datasource:
    url: ${SALARY_DB_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${SALARY_DB_USERNAME:salary_app}
    password: ${SALARY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: "health,loggers"

app:
  security:
    hr-manager:
      username: ${HR_MANAGER_USERNAME:hr-manager}
      password: ${HR_MANAGER_PASSWORD}
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 30
