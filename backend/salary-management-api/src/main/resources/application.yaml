spring:
  application:
    name: salary-management-api
  datasource:
    url: jdbc:postgresql://${SALARY_DB_HOST:localhost}:${SALARY_DB_PORT:5432}/${SALARY_DB_NAME:salary_management}
    username: ${SALARY_DB_USERNAME:salary_app}
    password: ${SALARY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: "health,loggers"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    hr-manager:
      username: ${HR_MANAGER_USERNAME:hr-manager}
      password: ${HR_MANAGER_PASSWORD}
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 30
